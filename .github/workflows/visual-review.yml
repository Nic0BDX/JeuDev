name: Visual review
on:
  pull_request:
    paths:
      - ".github/workflows/visual-review.yml"
      - "src/**"
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Validate story links and progression data
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const read = name => JSON.parse(readFileSync('src/data/' + name + '.json', 'utf8'));
          const {scenes, endings, cinematics} = read('story');
          const places = new Set(read('regions').flatMap(region => region.locations.map(place => place.id)));
          const species = new Set(read('creatures').map(creature => creature.id));
          const cast = new Set([...read('characters').map(character => character.id), 'narrator', 'florix', 'noctiri']);
          if (new Set(scenes.map(scene => scene.id)).size !== scenes.length) throw new Error('Duplicate story checkpoints');
          if (JSON.stringify([...new Set(scenes.map(scene => scene.chapter))]) !== JSON.stringify(Array.from({length:12}, (_, i) => i + 1))) throw new Error('Expected 12 ordered chapters');
          for (const scene of scenes) {
            if (!places.has(scene.location) || (scene.travel && !places.has(scene.travel))) throw new Error('Invalid location: ' + scene.id);
            if (!scene.lines.length || scene.lines.some(([speaker, line]) => !cast.has(speaker) || !line)) throw new Error('Invalid dialogue: ' + scene.id);
            if ((scene.battle && !species.has(scene.battle.id)) || (scene.gift && !species.has(scene.gift))) throw new Error('Invalid creature: ' + scene.id);
            if (scene.field && (!scene.field.length || scene.field.some(task => !places.has(task.location) || !task.label || !task.success))) throw new Error('Invalid field trial: ' + scene.id);
            if (scene.puzzle && !scene.puzzle.options[scene.puzzle.answer]) throw new Error('Invalid puzzle: ' + scene.id);
          }
          if (new Set(scenes.flatMap(scene => scene.shard ? [scene.shard] : [])).size !== 4 || !scenes.at(-1).ending || !endings.guardian || !endings.release || cinematics.length !== 14) throw new Error('Incomplete campaign');
          JS
      - name: Capture each screen and verify save reload
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/aetheris-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          mkdir -p captures
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({args: ['--enable-unsafe-swiftshader']});
          try {
            for (const [name, width, height] of [['desktop', 1440, 810], ['mobile', 390, 844]]) {
              const page = await browser.newPage({viewport: {width, height}, isMobile: name === 'mobile', hasTouch: name === 'mobile', reducedMotion: 'reduce'});
              await page.goto('http://127.0.0.1:5173/');
              await page.getByRole('heading', {name: 'Aetheris'}).waitFor();
              await page.evaluate(() => document.fonts.ready);
              const capture = async (screen, preview = false) => {
                await page.screenshot({path: 'captures/' + screen + '-' + name + '.png'});
                if (!preview) return;
                const cdp = await page.context().newCDPSession(page);
                const shot = await cdp.send('Page.captureScreenshot', {format: 'jpeg', quality: 48, clip: {x: 0, y: 0, width, height, scale: .45}});
                for (const [i, chunk] of shot.data.match(/.{1,5000}/g).entries()) console.log('AETHERIS_' + screen + '_' + name + '_' + i + ' ' + chunk);
                await cdp.detach();
              };
              await capture('title', true);
              await page.getByRole('button', {name: 'Characters', exact: true}).click();
              if (await page.locator('.character-cards article').count() !== 6) throw new Error('Expected six characters');
              await capture('characters', true);
              await page.getByRole('dialog').getByRole('button', {name: 'Close'}).click();
              await page.getByRole('button', {name: 'Creature Codex'}).click();
              await page.locator('.species-detail').getByRole('heading', {name: 'Florix'}).waitFor();
              await capture('dex');
              await page.getByRole('button', {name: 'Species Compendium'}).click();
              await page.getByRole('heading', {name: 'Grand Species Compendium'}).waitFor();
              if (await page.locator('.poster-type').count() !== 9) throw new Error('Expected nine type rows');
              await capture('compendium');
              await page.getByRole('button', {name: 'Close'}).click();
              await page.getByRole('button', {name: 'World Map'}).click();
              await page.locator('.world-atlas').getByText('0/64 discovered · 0%').waitFor();
              if (await page.locator('.map-marker').count() !== 64) throw new Error('Expected 64 locations');
              await capture('map');
              await page.getByRole('button', {name: 'Close'}).click();
              await page.getByRole('button', {name: 'Settings'}).click();
              await page.getByRole('heading', {name: 'Settings'}).waitFor();
              await capture('settings', true);
              await page.getByRole('button', {name: 'Back'}).click();
              await page.getByRole('button', {name: 'New Adventure'}).click();
              const prologue = page.getByRole('dialog', {name: 'Aetheris prologue'});
              await prologue.getByText('The islands of Aetheris float above the clouds.').waitFor();
              await capture('prologue');
              await prologue.getByRole('button', {name: 'Skip'}).click();
              await prologue.waitFor({state: 'detached'});
              await page.locator('.world canvas').waitFor();
              await page.locator('.quest-track').getByText('The Call of Skyspire').waitFor();
              await capture('hud', true);
              await page.getByRole('button', {name: 'Bag', exact: true}).click();
              await page.getByText('Field Bag · 120 coins').waitFor();
              await capture('bag');
              await page.locator('[data-bag="close"]').click();
              await page.getByRole('button', {name: 'Save game'}).click();
              await page.getByText('Adventure saved.').waitFor();
              const saved = await page.evaluate(() => JSON.parse(localStorage.getItem('aetheris.save')));
              if (saved.version !== 1 || saved.party.team.length !== 3) throw new Error('Save data did not persist');
              await page.reload();
              await page.getByRole('button', {name: 'Continue'}).click();
              await page.locator('.world canvas').waitFor();
              const resumed = await page.evaluate(() => JSON.parse(localStorage.getItem('aetheris.save')));
              if (JSON.stringify(resumed.position) !== JSON.stringify(saved.position)) throw new Error('Resume changed position');
              await capture('continue');
              await page.locator('.world-exit').click();
              await page.goto('http://127.0.0.1:5173/?performance=1');
              await page.getByRole('button', {name: 'Continue'}).click();
              await page.locator('.performance-meter[data-sample]').waitFor({timeout: 25000});
              const sample = JSON.parse(await page.locator('.performance-meter').getAttribute('data-sample'));
              if (!(sample.frames > 0 && sample.calls > 0)) throw new Error('No rendered frames recorded');
              console.log('AETHERIS_PERF ' + name + ' ' + JSON.stringify(sample));
              await page.keyboard.down('KeyA');
              await page.waitForTimeout(1100);
              await page.keyboard.up('KeyA');
              await page.getByRole('button', {name: 'Save game'}).click();
              const moved = await page.evaluate(() => JSON.parse(localStorage.getItem('aetheris.save')).position);
              if (!(moved[0] < saved.position[0] - 1)) throw new Error('Player did not cross the starting chunk boundary');
              await page.waitForFunction(() => {
                const canvas = document.querySelector('.world canvas');
                return canvas && canvas.width > 0 && canvas.height > 0;
              });
              await page.screenshot({path: 'captures/streaming-' + name + '.png'});
              await page.keyboard.down('KeyA');
              try {
                for (let attempt = 0; attempt < 12; attempt++) {
                  const prompt = await page.locator('.quest-track small').textContent();
                  const distance = Number(prompt.match(/(\d+) m/)?.[1] ?? Infinity);
                  if (distance <= 10) break;
                  await page.waitForTimeout(300);
                }
              } finally {
                await page.keyboard.up('KeyA');
              }
              await page.getByRole('button', {name: 'Interact', exact: true}).click();
              await page.getByRole('heading', {name: 'Chapitre 1 · La créature blessée'}).waitFor();
              await page.getByRole('textbox', {name: 'Nom du héros'}).fill('Ari');
              await capture('florix-rescue', true);
              for (let line = 0; line < 5; line++) await page.getByRole('button', {name: 'Suivant'}).click();
              await page.getByRole('button', {name: 'Poursuivre'}).click();
              await page.waitForFunction(() => {
                const state = JSON.parse(localStorage.getItem('aetheris.save')).chronicle;
                return state.hero === 'Ari' && state.checkpoint === 'wild-mossling';
              });
              await page.locator('.world-exit').click();
              await page.evaluate(({x, z}) => {
                const save = JSON.parse(localStorage.getItem('aetheris.save'));
                save.position = [x, 5, z];
                save.vertical = 0;
                save.chronicle = {next: 5, hero: "Ari", shards: []};
                save.glide = false;
                localStorage.setItem('aetheris.save', JSON.stringify(save));
              }, {"x":88,"z":33});
              await page.reload();
              await page.getByRole('button', {name: 'Continue'}).click();
              await page.getByRole('button', {name: 'Interact', exact: true}).click();
              await page.getByRole('dialog').getByRole('heading', {name: 'Chapitre 3 · Skyspire City'}).waitFor();
              await page.getByRole('button', {name: 'Suivant'}).click();
              await page.getByText('Ce cristal… Où l’as-tu trouvé ?').waitFor();
              await capture('elara', true);
              for (let line = 0; line < 5; line++) await page.getByRole('button', {name: 'Suivant'}).click();
              await page.getByRole('button', {name: 'Poursuivre'}).click();
              await page.waitForFunction(() => JSON.parse(localStorage.getItem('aetheris.save')).chronicle.next === 6);
              await page.locator('.world-exit').click();
              await page.evaluate(() => {
                const save = JSON.parse(localStorage.getItem('aetheris.save'));
                save.position = [-79, 92, -631];
                save.chronicle = {next: 24, hero: "Ari", shards: ["fire","crystal","wind","water"]};
                localStorage.setItem('aetheris.save', JSON.stringify(save));
              });
              await page.getByRole('button', {name: 'Continue'}).click();
              await page.getByRole('button', {name: 'Interact', exact: true}).click();
              await page.getByRole('heading', {name: 'Chapitre 12 · Le choix'}).waitFor();
              for (let line = 0; line < 3; line++) await page.getByRole('button', {name: 'Suivant'}).click();
              await page.getByRole('button', {name: 'Poursuivre'}).click();
              await page.getByRole('button', {name: name === 'mobile' ? 'Libérer l’Aether' : 'Devenir le Gardien'}).click();
              await capture('ending', true);
              await page.getByRole('button', {name: 'Terminer le récit'}).click();
              const outcome = await page.evaluate(() => JSON.parse(localStorage.getItem('aetheris.save')).chronicle.ending);
              if (outcome !== (name === 'mobile' ? 'release' : 'guardian')) throw new Error('Ending was not saved');
              if (name === 'desktop') {
                const seedTrial = async (position, chronicle) => {
                  await page.locator('.world-exit').click();
                  await page.evaluate(({position, chronicle}) => {
                    const save = JSON.parse(localStorage.getItem('aetheris.save'));
                    save.position = position;
                    save.vertical = 0;
                    save.glide = false;
                    if (chronicle) save.chronicle = chronicle;
                    localStorage.setItem('aetheris.save', JSON.stringify(save));
                  }, {position, chronicle});
                  await page.getByRole('button', {name: 'Continue'}).click();
                };
                await seedTrial([471, 10, -341], {checkpoint: 'crater-vent', hero: 'Ari', shards: []});
                await page.getByRole('button', {name: 'Interact', exact: true}).click();
                await page.getByRole('heading', {name: 'Chapitre 4 · La Forge du Cratère'}).waitFor();
                await page.getByRole('button', {name: 'Suivant'}).click();
                await page.getByRole('button', {name: 'Poursuivre'}).click();
                await page.locator('.quest-track small').getByText('Ouvrir l’évent de pression', {exact: false}).waitFor();
                await capture('forge-trial', true);
                await seedTrial([449, 10, -408], null);
                await page.getByRole('button', {name: 'Interact', exact: true}).click();
                await page.locator('.quest-track small').getByText('Ouvrir l’abri des petits', {exact: false}).waitFor();
                await capture('forge-vent', true);
                await seedTrial([521, 10, -457], null);
                await page.getByRole('button', {name: 'Interact', exact: true}).click();
                await page.waitForFunction(() => JSON.parse(localStorage.getItem('aetheris.save')).chronicle.checkpoint === 'volflare-and-cubs');
              }
              await page.close();
            }
          } finally {
            await browser.close();
          }
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: aetheris-visual-review
          path: captures/
          if-no-files-found: error
