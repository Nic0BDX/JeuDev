name: Visual review
on:
  pull_request:
    paths:
      - ".github/workflows/visual-review.yml"
      - "src/**"
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Capture title
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/aetheris-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          mkdir -p captures
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          try {
            for (const [name, width, height] of [['desktop', 1440, 810], ['mobile', 390, 844]]) {
              const page = await browser.newPage({viewport: {width, height}, isMobile: name === 'mobile', hasTouch: name === 'mobile', reducedMotion: 'reduce'});
              await page.goto('http://127.0.0.1:5173/');
              await page.getByRole('heading', {name: 'Aetheris'}).waitFor();
              await page.evaluate(() => document.fonts.ready);
              await page.screenshot({path: 'captures/title-' + name + '.png'});
              await page.close();
            }
          } finally {
            await browser.close();
          }
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: aetheris-title
          path: captures/
          if-no-files-found: error
