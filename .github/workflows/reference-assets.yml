name: Reference assets
on:
  pull_request:
    branches: [main]
    paths:
      - "reference/**"
      - "scripts/slice-assets.py"
      - ".github/workflows/reference-assets.yml"
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - run: python scripts/slice-assets.py --output reference-crops
      - name: Verify exported portraits
        run: test "$(find reference-crops/creatures -name '*.webp' | wc -l)" -eq 36
      - uses: actions/upload-artifact@v4
        with:
          name: aetheris-reference-crops
          path: reference-crops/
      - name: Transfer reviewed draft crops
        run: |
          python - <<'PY'
          from base64 import b64encode
          from pathlib import Path

          root = Path("reference-crops")
          for file in sorted(root.rglob("*.webp")):
              data = b64encode(file.read_bytes()).decode()
              for offset in range(0, len(data), 5000):
                  print(f"REF_CROP {file.relative_to(root).as_posix()} {offset} {data[offset:offset + 5000]}")
          PY
