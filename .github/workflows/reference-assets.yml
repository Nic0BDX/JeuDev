name: Reference assets
on:
  pull_request:
    branches: [main]
    paths:
      - "reference/**"
      - "scripts/slice-assets.py"
      - ".github/workflows/reference-assets.yml"
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - run: python scripts/slice-assets.py --output reference-crops
      - name: Verify exported portraits
        run: test "$(find reference-crops/creatures -name '*.webp' | wc -l)" -eq 36
      - uses: actions/upload-artifact@v4
        with:
          name: aetheris-reference-crops
          path: reference-crops/
